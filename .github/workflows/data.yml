name: Daten aktualisieren

# Monatlich: Länderinfos + Vignettenpreise (ADAC, nur Fakten) und Offline-Pakete "Toiletten & Rastplätze" (OpenStreetMap).
on:
  schedule:
    - cron: "17 3 2 * *"   # am 2. jedes Monats
  workflow_dispatch:
    inputs:
      packs:
        description: "OSM-Pakete neu bauen"
        type: boolean
        default: true
      nur:
        description: "Nur diese Länder bauen (z. B. GR oder GR,HR) – leer = alle"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  countries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: ADAC-Daten holen (ohne Regeltexte)
        env: { OUT_DIR: data, PUBLIC: "1" }
        run: |
          python tools/update_country_data.py
          # Schutz: nur übernehmen, wenn noch (fast) alle Länder erkannt wurden
          python -c "import json,sys; n=len(json.load(open('data/countries.json',encoding='utf-8'))['countries']); print(n,'Länder'); sys.exit(0 if n>=30 else 'ADAC-Format geändert? nur %d Länder' % n)"
      - name: Einchecken
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Länderdaten/Vignetten aktualisiert (ADAC)"
          git pull --rebase && git push
      - name: Ins Release "data"
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view data >/dev/null 2>&1 || gh release create data --title "Daten" --notes "Automatisch erzeugte Daten für die App RoutenBegleiter"
          gh release upload data data/countries.json data/vignettes.json data/config.json --clobber

  packs:
    if: github.event_name == 'schedule' || inputs.packs
    needs: countries
    runs-on: ubuntu-latest
    timeout-minutes: 75   # hängender Download → abbrechen statt 6 h warten
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - { iso: DE, geo: europe/germany }
          - { iso: AT, geo: europe/austria }
          - { iso: CH, geo: europe/switzerland }
          - { iso: LI, geo: europe/liechtenstein }
          - { iso: FR, geo: europe/france }
          - { iso: IT, geo: europe/italy }
          - { iso: ES, geo: europe/spain }
          - { iso: PT, geo: europe/portugal }
          - { iso: NL, geo: europe/netherlands }
          - { iso: BE, geo: europe/belgium }
          - { iso: LU, geo: europe/luxembourg }
          - { iso: DK, geo: europe/denmark }
          - { iso: PL, geo: europe/poland }
          - { iso: CZ, geo: europe/czech-republic, fr: europe/czech_republic }
          - { iso: SK, geo: europe/slovakia }
          - { iso: HU, geo: europe/hungary }
          - { iso: SI, geo: europe/slovenia }
          - { iso: HR, geo: europe/croatia }
          - { iso: BA, geo: europe/bosnia-herzegovina }
          - { iso: RS, geo: europe/serbia }
          - { iso: ME, geo: europe/montenegro }
          - { iso: AL, geo: europe/albania }
          - { iso: MK, geo: europe/macedonia }
          - { iso: GR, geo: europe/greece }
          - { iso: BG, geo: europe/bulgaria }
          - { iso: RO, geo: europe/romania }
          - { iso: MD, geo: europe/moldova }
          - { iso: TR, geo: europe/turkey }
          - { iso: GB, geo: europe/great-britain, fr: europe/united_kingdom }
          - { iso: IE, geo: europe/ireland-and-northern-ireland }
          - { iso: NO, geo: europe/norway }
          - { iso: SE, geo: europe/sweden }
          - { iso: FI, geo: europe/finland }
          - { iso: EE, geo: europe/estonia }
          - { iso: LV, geo: europe/latvia }
          - { iso: LT, geo: europe/lithuania }
    steps:
      - uses: actions/checkout@v7
        with: { sparse-checkout: tools }
      # osmium über conda-forge (die Ubuntu-Paketserver sind vom Runner-Image ubuntu-26.04 aus oft nicht erreichbar)
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: osm
          create-args: osmium-tool pyosmium python=3.12
          init-shell: bash
      - name: OSM-Auszug laden
        id: dl
        # Teil-Lauf: nur die unter „nur“ genannten Länder (übrige Pakete bleiben unverändert im Release)
        if: ${{ !inputs.nur || contains(format(',{0},', inputs.nur), format(',{0},', matrix.iso)) }}
        shell: bash -el {0}
        run: |
          # Geofabrik weist einzelne GitHub-Server zeitweise ab. Reihenfolge: normal → IPv4 → Ersatz-Server
          # (openstreetmap.fr, hat nicht alle Länder) → nach Pause erneut → Overpass (nur die benötigten Objekte,
          # unabhängig von Geofabrik). Klappt nichts, bleibt das Paket vom letzten Lauf im Release stehen.
          G="https://download.geofabrik.de/${{ matrix.geo }}-latest.osm.pbf"
          M="https://download.openstreetmap.fr/extracts/${{ matrix.fr || matrix.geo }}-latest.osm.pbf"
          get() { curl -sSfL --retry 2 --retry-all-errors --retry-delay 15 --speed-limit 100000 --speed-time 120 -o land.osm.pbf "$@"; }
          overpass() {
            # genau die Objekte, die „Filtern und Pakete bauen“ braucht – kleine Abfrage, damit Overpass sie annimmt
            Q='[out:xml][timeout:900][maxsize:1073741824];area["ISO3166-1"="${{ matrix.iso }}"]["admin_level"="2"]->.a;(nwr(area.a)["amenity"~"^(toilets|fast_food|charging_station)$"];nwr(area.a)["highway"~"^(rest_area|services)$"];nwr(area.a)["toilets:fee"="no"];node(area.a)["highway"="speed_camera"];nwr(area.a)["boundary"="low_emission_zone"];);(._;>;);out;'
            # Overpass ist oft kurz überlastet (502/504) → zwei Runden mit Pause
            for ep in https://overpass-api.de/api/interpreter https://overpass.private.coffee/api/interpreter https://overpass.kumi.systems/api/interpreter                       https://overpass-api.de/api/interpreter https://overpass.private.coffee/api/interpreter; do
              echo "Overpass: $ep"
              if curl -sSf -m 1800 -A "RoutenBegleiter-Daten (github.com/${{ github.repository }})" --data-urlencode "data=$Q" -o land.osm "$ep"                  && head -c 400 land.osm | grep -q "<osm" && grep -q "<node" land.osm; then
                osmium cat land.osm -o land.osm.pbf --overwrite && return 0
              fi
              sleep 90
            done
            return 1
          }
          if get "$G" || get -4 "$G" || get "$M" || { sleep 180; get "$G"; } || { sleep 120; get -4 "$G"; } || overpass; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::${{ matrix.iso }}: OSM-Auszug nicht erreichbar (Geofabrik, Ersatz-Server und Overpass) – Paket vom letzten Lauf bleibt bestehen"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Filtern und Pakete bauen
        if: steps.dl.outputs.ok == 'true'
        shell: bash -el {0}
        run: |
          osmium tags-filter land.osm.pbf nwr/amenity=toilets nwr/highway=rest_area,services nwr/amenity=fast_food \
            nwr/toilets:fee=no n/highway=speed_camera -o f.osm.pbf
          # Umweltzonen aus demselben Auszug
          osmium tags-filter land.osm.pbf nwr/boundary=low_emission_zone -o lez.osm.pbf
          python tools/build_lez.py country ${{ matrix.iso }} lez.osm.pbf lez-${{ matrix.iso }}.json
          # Ladesäulen (eigenes Paket – die App lädt es nur, wenn „Ladesäulen“ eingeschaltet ist)
          osmium tags-filter land.osm.pbf nwr/amenity=charging_station -o charge.osm.pbf
          osmium export charge.osm.pbf -f geojsonseq --add-unique-id=type_id -o charge.geojsonseq
          python tools/build_charge_pack.py ${{ matrix.iso }} charge.geojsonseq charge-${{ matrix.iso }}.json.gz || echo "::warning::${{ matrix.iso }}: Ladesäulen-Paket nicht gebaut"
          rm land.osm.pbf
          osmium export f.osm.pbf -f geojsonseq --add-unique-id=type_id -o f.geojsonseq
          python tools/build_poi_pack.py ${{ matrix.iso }} f.geojsonseq poi-${{ matrix.iso }}.json.gz
      - name: Ins Release "data"
        if: steps.dl.outputs.ok == 'true'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release upload data poi-${{ matrix.iso }}.json.gz --clobber -R ${{ github.repository }}
          if [ -s charge-${{ matrix.iso }}.json.gz ]; then gh release upload data charge-${{ matrix.iso }}.json.gz --clobber -R ${{ github.repository }}; fi
      - uses: actions/upload-artifact@v7
        if: steps.dl.outputs.ok == 'true'
        with: { name: "lez-${{ matrix.iso }}", path: "lez-${{ matrix.iso }}.json", retention-days: 3 }

  lez:
    needs: packs
    if: always() && needs.packs.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { sparse-checkout: tools }
      - uses: actions/download-artifact@v8
        with: { path: lez, pattern: "lez-*" }
      - name: Umweltzonen zusammenführen (fehlende Länder behalten ihren alten Stand)
        run: python tools/build_lez.py merge lez lez.json.gz
      - name: Ins Release "data"
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release upload data lez.json.gz --clobber
