name: Daten aktualisieren

# Monatlich: Länderinfos + Vignettenpreise (ADAC, nur Fakten) und Offline-Pakete "Toiletten & Rastplätze" (OpenStreetMap).
on:
  schedule:
    - cron: "17 3 2 * *"   # am 2. jedes Monats
  workflow_dispatch:
    inputs:
      packs:
        description: "OSM-Pakete neu bauen"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  countries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: ADAC-Daten holen (ohne Regeltexte)
        env: { OUT_DIR: data, PUBLIC: "1" }
        run: python tools/update_country_data.py
      - name: Einchecken
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Länderdaten/Vignetten aktualisiert (ADAC)"
          git push
      - name: Ins Release "data"
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view data >/dev/null 2>&1 || gh release create data --title "Daten" --notes "Automatisch erzeugte Daten für die App RoutenBegleiter"
          gh release upload data data/countries.json data/vignettes.json --clobber

  packs:
    if: github.event_name == 'schedule' || inputs.packs
    needs: countries
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - { iso: DE, geo: europe/germany }
          - { iso: AT, geo: europe/austria }
          - { iso: CH, geo: europe/switzerland }
          - { iso: LI, geo: europe/liechtenstein }
          - { iso: FR, geo: europe/france }
          - { iso: IT, geo: europe/italy }
          - { iso: ES, geo: europe/spain }
          - { iso: PT, geo: europe/portugal }
          - { iso: NL, geo: europe/netherlands }
          - { iso: BE, geo: europe/belgium }
          - { iso: LU, geo: europe/luxembourg }
          - { iso: DK, geo: europe/denmark }
          - { iso: PL, geo: europe/poland }
          - { iso: CZ, geo: europe/czech-republic }
          - { iso: SK, geo: europe/slovakia }
          - { iso: HU, geo: europe/hungary }
          - { iso: SI, geo: europe/slovenia }
          - { iso: HR, geo: europe/croatia }
          - { iso: BA, geo: europe/bosnia-herzegovina }
          - { iso: RS, geo: europe/serbia }
          - { iso: ME, geo: europe/montenegro }
          - { iso: AL, geo: europe/albania }
          - { iso: MK, geo: europe/macedonia }
          - { iso: GR, geo: europe/greece }
          - { iso: BG, geo: europe/bulgaria }
          - { iso: RO, geo: europe/romania }
          - { iso: MD, geo: europe/moldova }
          - { iso: TR, geo: europe/turkey }
          - { iso: GB, geo: europe/great-britain }
          - { iso: IE, geo: europe/ireland-and-northern-ireland }
          - { iso: NO, geo: europe/norway }
          - { iso: SE, geo: europe/sweden }
          - { iso: FI, geo: europe/finland }
          - { iso: EE, geo: europe/estonia }
          - { iso: LV, geo: europe/latvia }
          - { iso: LT, geo: europe/lithuania }
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: tools }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
      - name: OSM-Auszug laden und filtern
        run: |
          curl -sSfL -o land.osm.pbf "https://download.geofabrik.de/${{ matrix.geo }}-latest.osm.pbf"
          osmium tags-filter land.osm.pbf nwr/amenity=toilets nwr/highway=rest_area,services nwr/amenity=fast_food \
            nwr/toilets:fee=no n/highway=speed_camera -o f.osm.pbf
          rm land.osm.pbf
          osmium export f.osm.pbf -f geojsonseq --add-unique-id=type_id -o f.geojsonseq
          python3 tools/build_poi_pack.py ${{ matrix.iso }} f.geojsonseq poi-${{ matrix.iso }}.json.gz
      - name: Ins Release "data"
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release upload data poi-${{ matrix.iso }}.json.gz --clobber -R ${{ github.repository }}
